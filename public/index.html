<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22423a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="次の回まで">
<title>次の回まで</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 黒板と白墨。講習の教室をスマホに持ち帰る。1カラム・下にタブ */
  --bg:#e9eee9;
  --surface:#f8faf7;
  --ink:#1d2f29;
  --muted:#5b6d66;
  --line:#cfd8d2;
  --board:#22423a;
  --board-ink:#eef3ea;
  --chalk:#e8b923;
  --ok:#2f7d55;
  --warn:#b4532a;
  --font-display:"Klee One","Hiragino Maru Gothic ProN",serif;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111916;--surface:#18231f;--ink:#e3ebe6;--muted:#93a49c;--line:#2b3a34;
    --board:#1f3d35;--board-ink:#eef3ea;--chalk:#f0c84a;--ok:#5cbf8a;--warn:#e08a5f;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111916;--surface:#18231f;--ink:#e3ebe6;--muted:#93a49c;--line:#2b3a34;
  --board:#1f3d35;--board-ink:#eef3ea;--chalk:#f0c84a;--ok:#5cbf8a;--warn:#e08a5f;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:max(14px,env(safe-area-inset-top))}
header.top h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:.04em;white-space:nowrap}
header.top .course{font-size:12px;color:var(--muted);text-align:right}
.sample{display:inline-block;font-size:11px;border:1px solid var(--muted);color:var(--muted);border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.switch{font-size:12px;color:var(--muted);text-decoration:underline;background:none;border:none;min-height:auto;padding:0;cursor:pointer}
main{flex:1;padding:8px 16px 104px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 8px;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.board{background:var(--board);color:var(--board-ink);border-radius:6px;padding:18px 18px 16px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.12)}
.board .label{font-size:13px;opacity:.8}
.board .count{font-family:var(--font-display);font-size:54px;line-height:1.1;font-variant-numeric:tabular-nums}
.board .count small{font-size:20px;margin-left:4px}
.board .next-title{font-family:var(--font-display);font-size:20px;margin-top:6px}
.board .when{font-size:14px;opacity:.85}
.board .chalkline{height:3px;width:72px;background:var(--chalk);border-radius:2px;margin:10px 0 8px;opacity:.9}
.board .prep{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

button,.btn{font:inherit;font-size:15px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;min-height:44px}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.btn-chalk{background:var(--chalk);border-color:var(--chalk);color:#1d2f29;font-weight:700}
.btn-board{background:var(--board);border-color:var(--board);color:var(--board-ink)}
.btn-ghost-board{background:transparent;color:var(--board-ink);border-color:rgba(238,243,234,.45)}
.btn-quiet{background:none;border-color:transparent;color:var(--muted);text-decoration:underline;padding:6px 4px;min-height:36px}
.btn-danger{color:var(--warn);border-color:var(--warn);background:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.panel.ask-share{border-color:var(--chalk);box-shadow:inset 4px 0 0 var(--chalk)}

.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 0;position:relative}
.flow li:not(:last-child)::before{content:"";position:absolute;left:10px;top:28px;bottom:-8px;width:2px;background:var(--line)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:3px;display:grid;place-items:center;font-size:12px;color:#fff}
.done .dot{background:var(--ok);border-color:var(--ok)}
.today .dot{border-color:var(--chalk);background:var(--chalk);color:#1d2f29}
.flow .when{font-size:13px;color:var(--muted)}
.flow .state{font-size:12px;font-weight:700;margin-left:6px}
.done .state{color:var(--ok)}
.today .state{color:#1d2f29;background:var(--chalk);padding:0 6px;border-radius:3px}

.lessons{display:flex;flex-direction:column;gap:10px}
.lesson-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.lesson-row .no{font-family:var(--font-display);font-size:26px;text-align:center;line-height:1}
.lesson-row .no small{display:block;font-size:11px;color:var(--muted);font-family:var(--font-body)}
.lesson-row .t{font-weight:700}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.seen,.chip.pub{border-color:var(--ok);color:var(--ok)}
.chip.next{background:var(--chalk);border-color:var(--chalk);color:#1d2f29;font-weight:700}
.chip.draft{border-color:var(--warn);color:var(--warn)}

.three{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:8px}
.three li{counter-increment:n;display:grid;grid-template-columns:30px 1fr;gap:8px;font-size:17px}
.three li::before{content:counter(n);font-family:var(--font-display);font-size:22px;color:var(--board);line-height:1.4}
:root[data-theme="dark"] .three li::before{color:var(--chalk)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .three li::before{color:var(--chalk)}}
.three li span{background:linear-gradient(transparent 62%, color-mix(in srgb,var(--chalk) 45%,transparent) 62%)}
.media{border:2px dashed var(--line);border-radius:6px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.video{position:relative;padding-top:56.25%;border-radius:6px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
audio{width:100%}
.audio{display:flex;align-items:center;gap:12px}
.audio .play{width:48px;height:48px;border-radius:50%;background:var(--board);color:var(--board-ink);border:none;display:grid;place-items:center;flex:none;padding:0}
.tabs-inline{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs-inline button{border:none;background:none;border-bottom:3px solid transparent;border-radius:0;padding:8px 10px;min-height:40px;color:var(--muted)}
.tabs-inline button[aria-selected="true"]{border-bottom-color:var(--chalk);color:var(--ink);font-weight:700}
dl.terms{margin:0;display:flex;flex-direction:column;gap:10px}
dl.terms dt{font-weight:700}
dl.terms dd{margin:0;color:var(--muted);font-size:15px}

.q{display:flex;flex-direction:column;gap:8px}
.q .stem{font-weight:700}
.q .opt{text-align:left;width:100%}
.q .opt.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok);opacity:1}
.q .opt.wrong{opacity:.55;text-decoration:line-through}
.q .exp{font-size:14px;border-left:3px solid var(--chalk);padding:6px 10px;background:color-mix(in srgb,var(--chalk) 10%,transparent)}
.qs{display:flex;flex-direction:column;gap:22px}

.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=password],input[type=url],input[type=number],input[type=datetime-local],select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:180px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{width:20px;height:20px}
.form{display:flex;flex-direction:column;gap:12px}
.notes{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.notes li{border-left:3px solid var(--line);padding:4px 10px;font-size:15px}
.notes li .who{font-size:12px;color:var(--muted)}
.notice{font-size:14px;padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.error{font-size:14px;padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.qa{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:none}
.qa .qq{font-weight:700}
.qa .qq::before{content:"問 ";font-family:var(--font-display);color:var(--muted)}
.qa .aa::before{content:"答 ";font-family:var(--font-display);color:var(--muted)}

.tally-board{background:var(--board);color:var(--board-ink);border-radius:6px;padding:16px 18px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.12)}
.tally-board .big{font-family:var(--font-display);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.tally-board .big small{font-size:16px;margin-left:4px}
.tally{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;min-height:40px}
.tally svg{width:40px;height:40px}
.tally svg path{stroke:var(--board-ink);stroke-width:3;stroke-linecap:round;fill:none;opacity:.92}
.tally svg path.new{stroke:var(--chalk)}
.ready{display:flex;flex-direction:column;gap:8px}
.ready .meter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ready .meter span{height:10px;border-radius:5px;background:var(--line)}
.ready .meter span.on{background:var(--ok)}
.ready ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ready li{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.ready li .box{width:20px;height:20px;border-radius:4px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;margin-top:4px}
.ready li.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.ready li.on .lbl{color:var(--muted);text-decoration:line-through}
.kinds,.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles{grid-template-columns:repeat(2,1fr)}
.kinds div,.tiles div{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.kinds b,.tiles b{display:block;font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kinds span,.tiles span{font-size:12px;color:var(--muted)}
.tiles div.warn b{color:var(--warn)}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.weeks div{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.weeks div.on{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 18%,transparent);color:var(--ink)}
.weeks div b{display:block;font-size:18px;font-family:var(--font-display)}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.history li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.history li:last-child{border-bottom:none}
.history .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.word{border-left:3px solid var(--chalk);padding:8px 12px;background:color-mix(in srgb,var(--chalk) 10%,transparent);font-family:var(--font-display);font-size:16px}
.word .by{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);margin-top:4px}
.everyone{display:flex;align-items:center;gap:12px}
.everyone .dots{display:flex;flex-wrap:wrap;gap:4px;max-width:150px;flex:none}
.everyone .dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.everyone .dots i.on{background:var(--ok)}
.people{width:100%;border-collapse:collapse;font-size:15px}
.people th,.people td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.people th{font-size:12px;color:var(--muted);font-weight:400}
.people td.n{font-variant-numeric:tabular-nums}
.letter{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.letter:last-child{border-bottom:none}
.letter pre{white-space:pre-wrap;font:inherit;font-size:15px;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
.preview{font-size:14px;border:1px dashed var(--line);border-radius:6px;padding:10px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--board);color:var(--board-ink);padding:10px 16px;border-radius:6px;font-size:14px;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:5}
.toast b{color:var(--chalk);font-family:var(--font-display);font-size:16px}
.login{max-width:360px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .board{text-align:center}

nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .inner{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.bottom button{border:none;border-radius:0;background:none;min-height:60px;padding:6px 2px;white-space:nowrap;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--chalk)}
.back{align-self:flex-start;min-height:36px;padding:4px 10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>次の回まで</h1>
    <div class="course" id="courseName"></div>
  </header>
  <main id="view" class="view" tabindex="-1"><p class="muted">読み込んでいます…</p></main>
  <nav class="bottom" id="nav" aria-label="画面の切り替え" hidden><div class="inner" id="navInner"></div></nav>
</div>

<script>
"use strict";
/* ============================================================
   次の回まで
   サーバー（Cloudflare）があれば本番、なければ見本で動く
   ============================================================ */
const DAY = 86400000;
const KIND = { attend: "講習に出た", review: "回を見返した", listen: "おさらい音声を聞いた",
  correct: "問題に正解した", try: "やってみたを残した", ask: "質問を送った" };
const WORD_LABEL = { firstTry: "初めてのやってみた", tally5: "一つ目の正（5画）", ready: "準備ととのった",
  tally10: "二つ目の正（10画）", idle: "7日動きがないとき" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wd = "日月火水木金土";
const fmt = d => { d = new Date(d); return `${d.getMonth()+1}月${d.getDate()}日（${wd[d.getDay()]}）${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`; };
const md = d => { d = new Date(d); return `${d.getMonth()+1}/${d.getDate()}`; };
const daysUntil = d => Math.max(0, Math.ceil((new Date(d) - Date.now()) / DAY));
const ymd = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function drop(k){ try{ localStorage.removeItem(k); }catch(e){} }
const toLocalInput = iso => { if (!iso) return ""; const d = new Date(iso); const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fromLocalInput = v => v ? new Date(v).toISOString() : "";

/* ---------- 見本（サーバーがないとき） ---------- */
const SAMPLE_TASK = "自院の案内文を一つ用意し、AIに読みやすく直してもらう（患者さんの名前は入れない）";
function makeDemo(){
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 4, 20, 0);
  const t0 = first.getTime();
  return {
    courseName: "施術者のためのAI入門",
    words: { firstTry: "試したことが、いちばんの復習です。", tally5: "一つ目の「正」。いい調子です。",
      ready: "準備ととのいました。当日は、持ってきたものから始めましょう。", tally10: "二つ目の「正」。ここまで来たら、もう習慣です。",
      idle: "見返すのは1分の音声だけでも大丈夫です。" },
    lessons: [
      { no: 1, title: "AIで何ができるか", date: first.toISOString(), published: true, video: "", audio: false, data: {
        three: ["AIは下書き係。仕上げは自分の目で", "患者さんの名前や症状はAIに入れない", "頼むときは「誰に・何を・どのくらい」"],
        text: ["AIは、頼めばすぐに文章の下書きを出してくれます。ただ、出てきたものは下書きです。院の名前で外に出す前に、必ず自分で読んで直します。",
          "入れてはいけないものがあります。患者さんの名前、症状、写真。院の外に出してはいけない情報は、AIにも入れません。",
          "頼み方のこつは三つです。誰に向けた文か、何を書いてほしいか、どのくらいの長さか。この三つが書いてあるだけで、下書きはぐっと使えるものになります。"],
        terms: [["プロンプト", "AIへの頼み文のこと。普段の言葉で書いてかまいません"], ["下書き", "AIが出した文。そのまま使わず、自分で直す前提のもの"], ["チャット", "AIと文字でやりとりする画面"]],
        quiz: [
          { stem: "AIに入れてはいけないものはどれ？", opts: ["院の営業時間", "患者さんの名前と症状", "ブログの題名の案"], a: 1, exp: "院の外に出せない情報は、AIにも入れません。営業時間や題名の案は入れて大丈夫です。" },
          { stem: "頼み方で大事な三つは？", opts: ["誰に・何を・どのくらい", "丁寧語・敬語・謙譲語", "長く・細かく・何度も"], a: 0, exp: "誰に向けた文か、何を書くか、どのくらいの長さか。これだけで下書きが変わります。" },
          { stem: "AIが書いた文章はどうする？", opts: ["そのまま出す", "自分で読んで直してから出す", "使わない"], a: 1, exp: "下書きとして使い、自分の言葉に直してから出します。表現の点検には、ことば整えのような道具も使えます。" }],
        task: SAMPLE_TASK } },
      { no: 2, title: "院の文章をAIと直す", date: new Date(t0 + 14*DAY).toISOString(), published: false, data: null, video: "", audio: false },
      { no: 3, title: "小さな道具を一つ作る", date: new Date(t0 + 28*DAY).toISOString(), published: false, data: null, video: "", audio: false }
    ],
    log: [
      { k: "attend", key: "1", t: t0 + 3600000 },
      { k: "review", key: "1", t: t0 + 7200000 },
      { k: "listen", key: "1", t: t0 + 3*DAY },
      { k: "correct", key: "1-0", t: now.getTime() - DAY }
    ],
    myTries: [],

/* ---------- 回の状態 ---------- */
function withStatus(lessons){
  const now = Date.now(); let nextFound = false;
  return lessons.slice().sort((a,b) => a.no - b.no).map(l => {
    const t = Date.parse(l.date); let status;
    if (t <= now) status = l.published && l.data ? "done" : "prep";
    else if (!nextFound) { status = "next"; nextFound = true; } else status = "later";
    return { ...l, status };
  });
}

/* ---------- サーバーとのやりとり ---------- */
let MODE = "demo", ROLE = null, TOKEN = null, NEEDS_SETUP = false;
async function api(path, opts = {}){
  const headers = { ...(opts.headers || {}) };
  if (TOKEN) headers.authorization = "Bearer " + TOKEN;
  let body = opts.body;
  if (body && !(body instanceof Blob) && typeof body !== "string") { body = JSON.stringify(body); headers["content-type"] = "application/json"; }
  const res = await fetch(path, { method: opts.method || "GET", headers, body });
  let data = {}; try { data = await res.json(); } catch(e) {}
  if (res.status === 401 && path !== "/api/login") { logout(true); throw new Error(data.error || "もう一度入ってください"); }
  if (!res.ok) throw new Error(data.error || "うまくいきませんでした（" + res.status + "）");
  return data;
}
async function detect(){
  try {
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 3500);
    const r = await fetch("/api/ping", { signal: ctrl.signal });
    if (r.ok) { const d = await r.json(); if (d.ok) { NEEDS_SETUP = !!d.setup; return "api"; } }
  } catch(e) {}
  return "demo";
}

function readinessOf(log, since){
  const after = log.filter(e => e.t >= since);
  return [after.some(e => e.k === "review" || e.k === "listen"), after.some(e => e.k === "correct"), after.some(e => e.k === "try")];

let toastTimer;
function toast(html){
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.innerHTML = html; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3400);
}
function demoDup(k, key){
  const today = ymd(Date.now());
  if (k === "correct" || k === "attend") return S.log.some(e => e.k === k && e.key === key);
  return S.log.some(e => e.k === k && (e.key || null) === (key || null) && ymd(e.t) === today);
}
function afterAdded(k, t, key){
  const r0 = readiness(); const wasReady = r0 && r0.count === 3;
  S.log.push({ k, key: key || null, t });
  const n = S.log.length, W = S.words;

  if (n === 5) msg = `<b>正</b>　${esc(W.tally5)}`;
  if (n === 10) msg = `<b>正 正</b>　${esc(W.tally10)}`;
  const r1 = readiness();
  if (!wasReady && r1 && r1.count === 3) msg = `<b>準備ととのった</b>　${esc(W.ready)}`;
  toast(msg);
}
async function record(k, key){
  key = key == null ? null : String(key);
  try {
    if (MODE === "api") { const r = await api("/api/event", { method: "POST", body: { k, key } }); if (r.added) afterAdded(k, r.t, key); }

}

/* ---------- 正の字 ---------- */
function tallySVG(total, fresh){
  const strokes = ["M8 8 L32 8", "M20 8 L20 34", "M20 20 L31 20", "M10 20 L10 34", "M6 34 L34 34"];
  let out = "", i = 0;
  for (let g = 0; g < Math.ceil(total / 5); g++) {
    let paths = "";
    for (let s = 0; s < 5 && i < total; s++, i++) {
      const jit = ((i * 37) % 7 - 3) * 0.35;
      const d = strokes[s].replace(/(\d+) (\d+)/g, (m, x, y) => `${(+x + jit).toFixed(1)} ${(+y - jit).toFixed(1)}`);
      paths += `<path d="${d}" class="${i >= total - fresh ? "new" : ""}"/>`;
    }
    out += `<svg viewBox="0 0 40 40" aria-hidden="true">${paths}</svg>`;
  }
  return out;
}

const PROMPT = (course, no, title, audience, ng) => `あなたは講習の復習用教材を作る手伝いをします。
下に貼る講習の文字起こし（またはメモ）をもとに、次の形で下書きを作ってください。

【講習】
講座名：${course}
回：第${no}回
題：${title}
受講者：${audience}

【作るもの】
1. 今日の3つ：要点を3つ。1つ20字前後
2. テキスト：読んで復習する文。3〜5段落。1段落100〜150字
3. 用語集：講習で出てきた言葉を3〜6個。それぞれ1行で説明
4. 確認問題：3問。選択肢は3つ。答えと、1〜2文の解説
5. 次回までのお題：1つ。15分でできること

【守ること】
- 講習で話していないことを足さない。わからないところは「（講師確認）」と書く
- 個人がわかること（お客さま・患者さんの名前、体のこと、写真など）は入れない
- 講習で「外には出さない」とした内容は書かない
- 言い切りすぎない（「必ず」「絶対」など）${ng.length ? `
- 次の言葉は使わない：${ng.join("、")}` : ""}
- 料金や数字は、講習で言ったものだけを使う
- やさしい言葉で。専門用語を使うときは用語集に入れる

【返す形】
次のJSONだけを返してください。
{
  "three": ["要点1", "要点2", "要点3"],
  "text": ["段落1", "段落2", "段落3"],
  "terms": [["言葉", "説明"]],
  "quiz": [{"stem": "問い", "opts": ["選択肢1", "選択肢2", "選択肢3"], "a": 0, "exp": "解説"}],
  "task": "次回までのお題"
}
（"a" は正解の選択肢の番号。1つ目が0、2つ目が1、3つ目が2）

【文字起こし】
（ここに貼る）`;

const ngList = () => (TS && TS.ngWords || "").split(/[、,，\s]+/).map(w => w.trim()).filter(Boolean);
function parseLessonJSON(txt){
  if (!txt.trim()) return { data: null };
  let s = txt.trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a < 0 || b < a) return { error: "{ から } までの形が見つかりません。Claudeの返事のJSONの部分を貼ってください。" };
  let d; try { d = JSON.parse(s.slice(a, b + 1)); } catch(e) { return { error: "形が読めませんでした。貼るときに途中が欠けていないか確かめてください。" }; }
  const errs = [];
  if (!Array.isArray(d.three) || d.three.length < 1) errs.push("今日の3つ（three）がありません");
  if (!Array.isArray(d.text) || !d.text.length) errs.push("テキスト（text）がありません");
  d.terms = Array.isArray(d.terms) ? d.terms.filter(t => Array.isArray(t) && t[0] && t[1]) : [];
  d.quiz = Array.isArray(d.quiz) ? d.quiz : [];
  d.quiz.forEach((q, i) => { if (!q || !q.stem || !Array.isArray(q.opts) || !Number.isInteger(q.a) || q.a < 0 || q.a >= q.opts.length) errs.push(`問題${i+1}の形がおかしいところがあります（答えの番号など）`); });
  d.task = typeof d.task === "string" ? d.task : "";
  if (errs.length) return { error: errs.join("／") };
  const all = JSON.stringify(d);
  const hits = ngList().filter(w => all.includes(w));
  const check = all.includes("講師確認");
  return { data: d, hits, check };
}

let loginCode = "";

let current = "home", currentArg = null;
function setNav(){
  const nav = document.getElementById("nav"), inner = document.getElementById("navInner");
  if (!ROLE) { nav.hidden = true; return; }

function setHeader(){
  const c = document.getElementById("courseName");

    (MODE === "demo" && ROLE ? `<br><button class="switch" data-role="${ROLE === "t" ? "m" : "t"}">${ROLE === "t" ? "参加者の画面を見る" : "講師の画面を見る"}</button>` : "");

function render(name, arg){
  current = name; currentArg = arg;
  const v = document.getElementById("view");
  let html;
  if (name === "setup") html = setupView(arg);
  else if (!ROLE) html = loginView(name === "login-name" ? "name" : "code", arg);
  else if (ROLE === "t") html = ({ "t-lessons": tLessons, "t-letters": letters, "t-people": people, "t-questions": tQuestions, "t-settings": tSettings })[name]?.() ?? (name === "t-edit" ? tEdit(arg) : tLessons());
  else html = name === "lesson" ? lesson(arg) : (({ home, lessons, review, steps, ask })[name] || home)();
  v.innerHTML = html;
  setHeader();
  const navKey = name === "lesson" ? "lessons" : name === "t-edit" ? "t-lessons" : name;
  document.querySelectorAll("#navInner button").forEach(b => b.dataset.go === navKey ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
  const h = name === "lesson" ? "lesson-" + arg : (name === "t-edit" || name === "setup" || name.startsWith("login")) ? "" : name;
  if (h && location.hash.slice(1) !== h) { try { history.replaceState(null, "", "#" + h); } catch(e) {} }
  document.querySelectorAll("audio[data-listen]").forEach(a => a.addEventListener("play", () => record("listen", a.dataset.listen), { once: true }));
}
function rerenderKeepScroll(){ const y = window.scrollY; render(current, currentArg); window.scrollTo(0, y); }
function go(name, arg){ render(name, arg); window.scrollTo(0, 0); }

async function enter(role){
  ROLE = role;
  if (role === "t") { await loadTeacher(); setNav(); fromHash("t-lessons"); }
  else { await loadMember(); setNav(); fromHash("home"); }
}
function logout(silent){
  TOKEN = null; ROLE = null; drop("tsugi_token"); drop("tsugi_role");
  setNav(); go("login", silent ? "もう一度、合言葉から入ってください" : "");
}
function fromHash(fallback){
  const h = location.hash.slice(1);
  if (ROLE === "m") {
    const m = h.match(/^lesson-(\d+)$/);
    if (m) return go("lesson", +m[1]);
    if (["home","lessons","review","steps","ask"].includes(h)) return go(h);
  } else if (ROLE === "t" && ["t-lessons","t-letters","t-people","t-questions","t-settings"].includes(h)) return go(h);
  go(fallback);
}
window.addEventListener("hashchange", () => { if (ROLE) fromHash(ROLE === "t" ? "t-lessons" : "home"); });

async function copyText(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e) {}
  if (!ok) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch(e) {} ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = ok ? "コピーしました" : "長押しで選んでコピーしてください"; setTimeout(() => btn.textContent = o, 2000); }
}

/* ---------- 押したとき ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const ds = t.dataset;
  try {
    if (ds.go) { syncDraft(); return go(ds.go); }
    if (ds.role) { editDraft = null; await enter(ds.role); return; }
    if (ds.logout !== undefined) return logout(false);

    // はじめの設定
    if (ds.field) { setupField = ds.field; const keep = ["uCourse","uTeacher","uCode"].map(id => document.getElementById(id).value); go("setup"); ["uCourse","uTeacher","uCode"].forEach((id, i) => document.getElementById(id).value = keep[i]); return; }

      if (MODE === "api") {
        const r = await api("/api/setup", { method: "POST", body: { courseName, teacherName, field: setupField, teacherCode } }).catch(err => ({ error: err.message }));
        if (r.error) return go("setup", r.error);
        TOKEN = r.token; save("tsugi_token", TOKEN); save("tsugi_role", "t"); NEEDS_SETUP = false;
        setupDone = { memberCode: r.memberCode };
      } else {
        demo.courseName = courseName; demo.teacherName = teacherName || "講師"; Object.assign(demo, FIELD_PRESET[setupField]);
        setupDone = { memberCode: demo.memberCode };
      }
      return go("setup");
    }
    if (ds.setupnext !== undefined) { setupDone = null; return enter("t"); }

    // 入る
    if (ds.login1 !== undefined) {
      loginCode = document.getElementById("lCode").value.trim();
      if (!loginCode) return go("login", "合言葉を入れてください");
      t.disabled = true;
      const r = await api("/api/login", { method: "POST", body: { code: loginCode } }).catch(err => ({ error: err.message }));
      if (r.error) return go("login", r.error);
      if (r.need) return go("login-name");
      TOKEN = r.token; save("tsugi_token", TOKEN); save("tsugi_role", r.role); return enter(r.role);
    }
    if (ds.login2 !== undefined) {
      const name = document.getElementById("lName").value.trim(), pin = document.getElementById("lPin").value.trim();
      if (!name || !/^\d{4}$/.test(pin)) return go("login-name", "呼び名と、数字4けたの暗証番号を入れてください");
      t.disabled = true;
      const r = await api("/api/login", { method: "POST", body: { code: loginCode, name, pin } }).catch(err => ({ error: err.message }));
      if (r.error) return go("login-name", r.error);
      TOKEN = r.token; save("tsugi_token", TOKEN); save("tsugi_role", r.role); return enter(r.role);
    }

    // 参加者
    if (ds.open) { lessonTab = "text"; go("lesson", +ds.open); return record("review", ds.open); }
    if (ds.ltab) { lessonTab = ds.ltab; return rerenderKeepScroll(); }
    if (ds.attend) { await record("attend", ds.attend); return rerenderKeepScroll(); }
    if (ds.watched) { await record("review", ds.watched); t.textContent = "一画つきました"; t.disabled = true; return; }

      await loadTeacher(); toast("参加者の合言葉を作り直しました"); return rerenderKeepScroll();
    }
    if (ds.demosetup !== undefined) { ROLE = null; setNav(); return go("setup"); }
    if (ds.resetpin !== undefined) {
      const name = document.getElementById("rName").value;
      if (MODE === "api") await api("/api/t/reset-pin", { method: "POST", body: { name } });
      document.getElementById("rMsg").innerHTML = `<p class="notice">${esc(name)} さんは、次に入るとき新しい番号を決めます。${MODE === "demo" ? "（見本）" : ""}</p>`; return;
    }
  } catch(err) { t.disabled = false; toast(esc(err.message || "うまくいきませんでした")); }
});
document.addEventListener("change", async e => {
  if (e.target.id === "shareToggle") {
    const v = e.target.checked;
    try { if (MODE === "api") await api("/api/me", { method: "POST", body: { showTeacher: v } }); S.me.showTeacher = v; S.me.askedShare = true; toast(v ? "講師に見せます" : "講師には見せません"); }
    catch(err) { e.target.checked = !v; toast(esc(err.message)); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "lCode") document.querySelector("[data-login1]")?.click();
  if (e.target.id === "lPin") document.querySelector("[data-login2]")?.click();
});

/* ---------- はじまり ---------- */
(async () => {
  MODE = await detect();
  if (MODE === "api") {
    try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); } catch(e) {}
    if (NEEDS_SETUP) { ROLE = null; setNav(); return go("setup"); }
    TOKEN = load("tsugi_token", null); const role = load("tsugi_role", null);
    if (TOKEN && role) { try { await enter(role); return; } catch(e) {} }
    ROLE = null; setNav();
    const c = new URLSearchParams(location.search).get("c");
    if (c) {
      try { history.replaceState(null, "", location.pathname); } catch(e) {}
      loginCode = c;
      const r = await api("/api/login", { method: "POST", body: { code: c } }).catch(err => ({ error: err.message }));
      if (r.need) return go("login-name");
      return go("login", "リンクの合言葉が古いようです。講師から届いた合言葉を入れてください");
    }
    go("login");
  } else {
    demo = makeDemo();
    if (location.hash === "#setup") { ROLE = null; setNav(); return go("setup"); }
    await enter(location.hash.startsWith("#t-") ? "t" : "m");
  }
})();
</script>
</body>
